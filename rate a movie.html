<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 drill 2</title>
    <style>

        body{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        .box{
            border: 1px solid gray;
            border-radius: 4px;
            box-shadow: 5px;
            padding:10px;
            width: 80%;
        }

        .movietitle{
            margin: 10px;
        }

        .button{
            width:100%;
            text-align: center;
        }

        .box{
            width:100%;
            text-align:center;
        }


    </style>
</head>



<body>

   <h1> Rate a Movie </h1>
   <p> Share your Top Movie and write a review </p>

   
   <!--content-->
   <div class="box">
    <div class="movietitle">
    <input type="text" placeholder=" Select a Movie Title">
    </div>

    <div class="button">
    <fieldset>
        <Legend> Genres <em>(Select all that apply)</em></Legend>
        <input type="checkbox">
        <label> Action </label>

        <input type="checkbox">
        <label> Horror </label>

        <input type="checkbox">
        <label> Sci-fi </label>

        <input type="checkbox">
        <label> Comedy </label>

        <input type="checkbox">
        <label> Romance </label>

        <input type="checkbox">
        <label> Thriller </label>
    </fieldset>

    <fieldset>
        <Legend> Rating </Legend>
        <input type="radio" name="Rating">
        <label> ⭐ </label>

        <input type="radio" name="Rating"> 
        <label> ⭐⭐ </label>

        <input type="radio" name="Rating"> 
        <label> ⭐⭐⭐ </label>

        <input type="radio" name="Rating"> 
        <label> ⭐⭐⭐⭐ </label>

        <input type="radio" name="Rating"> 
        <label> ⭐⭐⭐⭐⭐ </label>
    </fieldset>
    
   </div>

   <textarea class="review" name="review" id="request" row="10" cols="30" placeholder="Write your review..."></textarea>
        
        <input class="submit" type="submit">

         <p> Movie Review Tips: Click <a href="https://www.nyfa.edu/student-resources/9-tips-for-writing-a-film-review/"> here </a> </p>
    </form>

   <footer>
        <p> © 2026 | Emiko Rebadulla | 9-Topaz | Q1 Drill 2  </p>
    </footer>

</body>
</html>
